name: Release

# Cuts an Issue Concierge release: tests, next version, preflight, release notes,
# manifest, tag and GitHub release. Modeled on the release workflows of the
# gearsnlevers action repositories. See docs/releases.md.
#
# It writes NOTHING to the default branch: no commit and no push of a branch. A
# bot that pushed there would be refused as soon as the default branch requires a
# pull request, and the token of this workflow cannot bypass that rule. The tag
# goes on the commit the run started from, which is the commit the manifest
# names; the notes of the release are the changelog (CHANGELOG.md points to the
# releases); package.json keeps its value, because the version comes from the
# tags. The only things this workflow writes to the repository are the tag and
# the release.
#
# A real release runs from the default branch. A dry run runs from any branch,
# writes nothing and publishes nothing, and uploads the manifest and the notes as
# an artifact. First run: choose release-type "major" with dry-run enabled, read
# the summary, then run it again without dry-run.

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release kind: prerelease | premajor | patch | minor | major'
        type: choice
        options:
          - prerelease
          - premajor
          - patch
          - minor
          - major
        default: 'prerelease'
        required: true
      dry-run:
        description: 'Compute everything and upload the manifest and notes as an artifact, but do not tag or publish'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      # The AI changelog needs an LLM key; without one the notes come from
      # GitHub's generated release notes.
      HAS_LLM_KEY: ${{ secrets.LLM_API_KEY != '' }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Require the default branch for a real release
        if: env.DRY_RUN != 'true' && github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::A real release must run from ${{ github.event.repository.default_branch }}. Enable dry-run to try other branches."
          exit 1

      - name: Unit tests
        run: npm test

      - name: Compile every workflow definition with gh-aw
        run: bash tools/ci-compile-smoke.sh

      - name: Compute next version
        id: version
        uses: gearsnlevers/version-bump-action@v1
        with:
          release-type: ${{ inputs.release-type }}

      - name: Release preflight checks
        uses: gearsnlevers/release-preflight-action@v1
        with:
          candidate-version: ${{ steps.version.outputs.newVersion }}
          candidate-tag: ${{ steps.version.outputs.newTag }}
          package-name: 'issue-concierge'
          current-version: ${{ steps.version.outputs.base }}
          check-remote-tag: true
          check-npm-version: false
          check-version-drift: true

      # The notes are the changelog: they are the body of the release, and nothing is committed. The action works
      # on a file of its own and not on CHANGELOG.md, so that no file of the commit is changed (the step after the
      # notes checks it).
      - name: Release notes (AI)
        if: env.HAS_LLM_KEY == 'true'
        uses: gearsnlevers/ai-changelog-action@v1
        with:
          github-token: ${{ github.token }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          target-user-type: developer
          release-type: ${{ steps.version.outputs.action_release_type }}
          version: ${{ steps.version.outputs.newVersion }}
          promote-release: true
          release-tag: ${{ steps.version.outputs.newTag }}
          release-notes-path: RELEASE_NOTES.md
          changelog-path: release-changelog-work.md
          commit: false

      - name: Release notes (GitHub generated)
        if: env.HAS_LLM_KEY != 'true'
        env:
          TAG: ${{ steps.version.outputs.newTag }}
          PREVIOUS: ${{ steps.version.outputs.base_ref }}
        run: |
          set -euo pipefail
          args=(-f "tag_name=${TAG}" -f "target_commitish=${GITHUB_SHA}")
          if [ -n "${PREVIOUS}" ]; then args+=(-f "previous_tag_name=${PREVIOUS}"); fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${args[@]}" --jq .body > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then printf 'Release %s.\n' "${TAG}" > RELEASE_NOTES.md; fi

      # The manifest is of the commit that is tagged, so no step may have changed a file of that commit: the files
      # are what the commit holds.
      - name: The files are the files of the commit
        run: |
          set -euo pipefail
          if ! git diff --quiet HEAD; then
            git status --short
            echo "::error::A step has changed a file of the commit that is released. This workflow writes nothing to the repository but the tag."
            exit 1
          fi

      # The manifest is of the commit that the run started from, which is the commit that is tagged (and the commit
      # a dry run was started from). What the install set refuses stops the run here, before the tag and the
      # release are written.
      - name: Build and verify the release manifest
        env:
          VERSION: ${{ steps.version.outputs.newVersion }}
          TAG: ${{ steps.version.outputs.newTag }}
        run: |
          set -euo pipefail
          node tools/build-release-manifest.mjs --version "${VERSION}" --tag "${TAG}" --commit "$(git rev-parse HEAD)" --out release-manifest.json
          node tools/build-release-manifest.mjs --verify release-manifest.json

      - name: Create and push tag
        if: env.DRY_RUN != 'true'
        env:
          TAG: ${{ steps.version.outputs.newTag }}
        run: |
          set -euo pipefail
          # The tag is the one thing this workflow writes to the repository. It goes on the commit the run started
          # from, which is the commit the manifest names, and it needs a name for the tagger because no step has
          # set one (the commit step that did is gone).
          current="$(git rev-parse HEAD)"
          if ! grep -qxF "  \"commit\": \"${current}\"," release-manifest.json; then
            echo "::error::The manifest does not name the commit that is to be tagged (${current})"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            existing="$(git rev-list -n 1 "${TAG}")"
            if [ "${existing}" = "${current}" ]; then
              echo "Tag ${TAG} already exists on the current commit; skipping"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on a different commit"
            exit 1
          fi
          git tag -a "${TAG}" -m "Release ${TAG}" "${current}"
          git push origin "refs/tags/${TAG}"

      - name: Publish GitHub release
        if: env.DRY_RUN != 'true'
        env:
          TAG: ${{ steps.version.outputs.newTag }}
          IS_PRERELEASE: ${{ steps.version.outputs.preRelease }}
        run: |
          set -euo pipefail
          # Immutable releases accept assets only before publication: create a
          # draft, upload the manifest, then publish. A draft left behind by a
          # failed run is replaced; a published release is never touched.
          if gh release list --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' | grep -xF "${TAG}" >/dev/null; then
            gh release delete "${TAG}" --yes
          fi
          args=(release create "${TAG}" release-manifest.json --draft --verify-tag --title "Issue Concierge ${TAG}" --notes-file RELEASE_NOTES.md)
          if [ "${IS_PRERELEASE}" = "true" ]; then args+=(--prerelease); fi
          gh "${args[@]}"
          gh release edit "${TAG}" --draft=false

      - name: Upload dry-run artifacts
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: |
            release-manifest.json
            RELEASE_NOTES.md

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.newVersion }}
          TAG: ${{ steps.version.outputs.newTag }}
          PRERELEASE: ${{ steps.version.outputs.preRelease }}
          BASE: ${{ steps.version.outputs.base }}
        run: |
          {
            echo "## Issue Concierge release"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Release type | ${{ inputs.release-type }} |"
            echo "| Base version | ${BASE:-n/a} |"
            echo "| New version | ${VERSION:-n/a} |"
            echo "| Tag | ${TAG:-n/a} |"
            echo "| Prerelease | ${PRERELEASE:-n/a} |"
            echo "| Notes | $([ "${HAS_LLM_KEY}" = "true" ] && echo "AI changelog" || echo "GitHub generated") |"
            echo "| Dry run | ${DRY_RUN} |"
          } >> "$GITHUB_STEP_SUMMARY"
