# Issue Concierge settings for this repository.
#
# Copy this file to .github/issue-concierge/settings.yml. It is optional: without it, or without a line,
# the default shown below applies.
#
# The Concierge reads the file from the default branch, so a change takes effect when it is merged, and a pull
# request cannot loosen the settings it is judged by. Only flat "key: value" lines are read. A line it cannot
# use (an unknown name, a value out of range) is reported by check-deployment and shown on the status issue,
# and the default stays; the Concierge never stops because of this file.

# NOT HERE: the pause switch. A gate must be able to check it without starting a run, and only a repository
# variable can be read that way. To pause the Concierge, create the repository variable
# ISSUE_CONCIERGE_PAUSED with the value true (Settings > Secrets and variables > Actions > Variables > New
# repository variable). To resume, delete the variable or set it to anything else. Its name in v2.0.x,
# CONCIERGE_PAUSED, still pauses, so delete that one too if it is set. In an organisation repository anyone with
# write access can do this.
# While it is paused, no gate, sweep, closer or notifier touches an issue or a pull request, the status issue shows
# a PAUSED banner, and a command that would hand an issue on is refused (declining and /help still work). Runs
# that are already in flight finish, and a run started by hand still works. An issue that was in a gate while the
# Concierge was paused may need /retry afterwards; the status issue shows it as stuck after an hour.

# status-issue: true | false                                       default: true
#   One pinned issue, "Issue Concierge status", created and kept up to date by the bot. It shows what waits for a
#   maintainer, reporter replies that nobody has answered, which issues the Concierge manages and which it
#   does not (opted out with no-auto-processing, opened by a bot, not yet picked up), health (the last good
#   run, failed runs, the pinned version against the latest release, the signal token's expiry) and the
#   spend of the last seven days. The Concierge ignores this issue: it is opened by a bot and carries
#   no-auto-processing. If the repository already has three pinned issues, GitHub's limit, the status issue
#   is created unpinned and says so.
#   false: the issue is closed and unpinned, never deleted, and nothing updates it. true again reopens it.
status-issue: true

# commands: true | false                                           default: true
#   The comment commands (/accept, /decline, /approve, /replan, /retry, /help) and the "options" comment that the
#   Concierge keeps as the last comment of an issue that waits for a maintainer: it says what is needed and
#   which command does what. It appears only while a maintainer has to act (a request held because it changes
#   what exists, a request held for the scope, a plan waiting for approval, a gate that has not moved for an
#   hour), moves to the end whenever someone comments, and is deleted when nothing is waiting any more.
#   false: no command is read and no options comment is posted. Labels still work by hand.
commands: true

# commands-need: triage | write | maintain | admin                 default: triage
#   The lowest repository role that may use the commands. Triage can already label and close issues by hand;
#   the commands are those same steps in one, with the person who gave them named in the thread. The roles
#   triage and maintain exist only in organisation repositories. In a personal repository the lowest role is
#   write, and a lower setting counts as write. A person below the role gets one reply saying so, if they are a
#   collaborator, and nothing at all if they are not. Approving the workflow runs of the coding agent, and
#   merging, need write access whatever this says.
commands-need: triage

# reporter-replies-days: 1 to 90                                   default: 14
#   How far back the status issue looks for reporter replies that wait for an answer: an open issue whose
#   latest comment is from someone who is not a maintainer (write, maintain or admin role) and not a bot,
#   and is newer than this many days. Opted-out issues are included and marked, since nobody else watches
#   them. The list shows the person's login and a link, never the text of the comment.
reporter-replies-days: 14

# mention-after-days: 0 to 90                                      default: 0 (never)
#   Mention the people who have the maintain or admin role in a comment on the status issue when something has
#   waited for a maintainer this many days or more: a request held because it changes what exists, one held for
#   the scope, or a plan waiting for approval. The options comment already notifies whoever follows an issue when
#   it is posted; this is the nudge for what stays unanswered. At most one such comment per this many days, and the
#   previous one is deleted when a new one is posted, or when nothing waits that long any more. It names at most
#   twenty people, and titles in it are written so that they mention nobody. It needs a token that may list the
#   repository's collaborators; if there is none, the status page says so and nobody is mentioned.
#   0 turns it off. Nothing is mentioned while the Concierge is paused.
mention-after-days: 0
